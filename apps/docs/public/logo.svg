<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Background -->
  <rect width="256" height="256" rx="64" fill="#030712" />
  <rect width="256" height="256" rx="64" fill="#20e4b2" fill-opacity="0.05" />

  <defs>
    <linearGradient id="paint0_linear" x1="128" y1="40" x2="128" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="paint1_linear" x1="176" y1="40" x2="176" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20e4b2" />
      <stop offset="1" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Left Slash -->
    <path d="M 72 192 L 120 64 L 152 64 L 104 192 Z" fill="url(#paint0_linear)" />
    <!-- Middle Slash (Offset) -->
    <path d="M 112 192 L 160 64 L 192 64 L 144 192 Z" fill="url(#paint1_linear)" fill-opacity="0.9" />
    <!-- Small Trailing Wind Slash -->
    <path d="M 160 192 L 192 104 L 216 104 L 184 192 Z" fill="#2dd4bf" fill-opacity="0.6" />
  </g>
</svg>
