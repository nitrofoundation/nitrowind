name: nitrowind-docs

services:
  docs:
    image: node:22-alpine
    command: ['node', 'apps/docs/server.js']
    working_dir: /app
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 8080
    ports:
      - '127.0.0.1:${DOCS_PORT:-8080}:8080'
    volumes:
      - ./current/standalone:/app
    networks:
      nitrowind-proxy:
    restart: unless-stopped

networks:
  nitrowind-proxy:
    external: true
