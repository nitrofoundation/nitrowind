name: Release packages

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment for every public package
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - premajor-beta
          - prerelease-beta

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Release public packages
        shell: bash
        run: |
          release_args=(--ci)

          case "${{ inputs.increment }}" in
            premajor-beta)
              release_args+=(--increment=premajor --preRelease=beta)
              export RELEASE_IT_WORKSPACES_TAG=beta
              ;;
            prerelease-beta)
              release_args+=(--increment=prerelease --preRelease=beta)
              export RELEASE_IT_WORKSPACES_TAG=beta
              ;;
            *)
              release_args+=(--increment=${{ inputs.increment }})
              export RELEASE_IT_WORKSPACES_TAG=latest
              ;;
          esac

          yarn release "${release_args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_CONFIG_PROVENANCE: "true"
